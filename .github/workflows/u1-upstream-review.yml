name: U1 upstream notifications
on:
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: u1-upstream-notifications
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository == 'zhavir/ultimate-u1-slicer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test monitoring and integration tooling
        run: python3 -m unittest discover -s tools/u1/tests -v
      - name: Detect branch, release and tag changes and notify the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/u1/upstream_watch.py --notify
      - name: Preserve exact observations and issue links
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-observations-${{ github.run_id }}
          path: build/upstream-watch.json
          if-no-files-found: warn
          retention-days: 30
