name: Ultimate U1 Windows portable
on:
  push:
    branches: [main]
    paths: ['src/**', 'deps/**', 'deps_src/**', 'cmake/**', 'resources/**', 'tests/**', '**/CMakeLists.txt', 'version.inc', 'build_win.bat', '.github/workflows/build_*.yml', '.github/workflows/u1-windows-portable.yml', 'tools/u1/windows/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified ZIP as an experimental prerelease
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: u1-windows-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/u1-component-tests.yml
    with:
      operating-systems: '["windows-latest"]'
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/u1/windows
      - name: Parse the native portable verification script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/u1/windows/verify-portable.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
  build:
    needs: [checks, preflight]
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      portable-only: true
    secrets: inherit
  verify:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/u1/windows
      - uses: actions/download-artifact@v8
        with:
          name: ultimate-u1-windows-x64-portable-${{ github.sha }}
          path: portable-artifact
      - name: Verify ZIP, native launch and portable data isolation
        shell: pwsh
        run: ./tools/u1/windows/verify-portable.ps1 -Archive portable-artifact/Ultimate-U1-Slicer-Windows-x64-portable.zip -OutputDirectory portable-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: Ultimate-U1-Windows-x64-portable-verified-${{ github.sha }}
          path: |
            portable-artifact/Ultimate-U1-Slicer-Windows-x64-portable.zip
            portable-evidence/SHA256SUMS
            portable-evidence/verification.json
          if-no-files-found: error
          retention-days: 30
  unit-tests:
    needs: build
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64
      test-dir: build/tests
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [verify, unit-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Ultimate-U1-Windows-x64-portable-verified-${{ github.sha }}
          path: verified
      - name: Publish experimental portable ZIP and verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="experimental-windows-${SOURCE_SHA:0:12}"
          cat > "$RUNNER_TEMP/u1-release-notes.md" <<'BODY'
          Experimental Windows x64 portable build of Ultimate U1 Slicer. Extract the ZIP into a writable folder and start orca-slicer.exe. Keep ultimate_u1_data_dir beside the executable; settings remain there. No installer is required.

          Native Windows GUI startup, bearer-authenticated MCP initialization, portable stdio discovery and portable data/registry isolation passed in CI. These checks do not establish complete U1 project compatibility, full FOrca feature parity or physical printer safety. See docs/roadmap.md and docs/testing/local-validation.md in this source revision. Do not treat this prerelease as a stable U1 release.
          BODY
          printf '\nSource: %s\n' "$SOURCE_SHA" >> "$RUNNER_TEMP/u1-release-notes.md"
          archive=$(find verified -name 'Ultimate-U1-Slicer-Windows-x64-portable.zip' -type f)
          checksums=$(find verified -name SHA256SUMS -type f)
          evidence=$(find verified -name verification.json -type f)
          test -f "$archive" && test -f "$checksums" && test -f "$evidence"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$checksums" "$evidence" --clobber
          else
            gh release create "$tag" --target "$SOURCE_SHA" --prerelease --title 'Ultimate U1 Slicer - experimental Windows x64 portable' --notes-file "$RUNNER_TEMP/u1-release-notes.md" "$archive" "$checksums" "$evidence"
          fi
