name: U1 component tests
on:
  push:
    branches: ["ultimate-u1/**", "main"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      operating-systems:
        description: JSON runner list for a platform-specific build gate
        type: string
        default: '["ubuntu-24.04", "windows-latest", "macos-15"]'
permissions:
  contents: read
jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.operating-systems || '["ubuntu-24.04", "windows-latest", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install pinned component build tools
        run: python -m pip install cmake==3.31.10 ninja==1.13.0 ruff==0.14.3 clang-format==19.1.7 lxml==6.1.3
      - name: Static checks for project tooling
        run: ruff check tools/u1
      - name: Check formatting of new C++ integration files
        run: >
          clang-format --dry-run --Werror
          src/libslic3r/U1FilamentPlan.hpp src/libslic3r/U1FilamentPlan.cpp
          src/slic3r/GUI/Mcp/McpFilePolicy.hpp src/slic3r/GUI/Mcp/McpU1Policy.hpp
          src/slic3r/GUI/Mcp/McpToolsU1.cpp
          tests/libslic3r/test_u1_filament_plan.cpp
          tests/slic3rutils/test_mcp_file_policy.cpp tests/slic3rutils/test_u1_mcp_protocol.cpp
          tests/fff_print/test_u1_four_tool_gcode.cpp tests/fff_print/test_u1_support_compatibility.cpp
          src/slic3r/Utils/SnapmakerFilamentState.hpp tests/slic3rutils/test_snapmaker_filament_state.cpp
          src/slic3r/Utils/GatewayAccount.cpp src/slic3r/Utils/GatewayAccount.hpp
          src/slic3r/Utils/GatewayProtocol.cpp src/slic3r/Utils/GatewayProtocol.hpp
          src/slic3r/Utils/GatewayService.cpp src/slic3r/Utils/GatewayService.hpp
          src/slic3r/Utils/ConnectionProcessManager.cpp src/slic3r/Utils/ConnectionProcessManager.hpp
          tests/slic3rutils/GatewayAccount_test.cpp tests/slic3rutils/GatewayProtocol_test.cpp
          tests/slic3rutils/GatewayService_test.cpp tests/slic3rutils/ConnectionProcessManager_test.cpp
      - name: Configure actual native source components
        run: cmake -S tools/u1/native-tests -B build/u1-native -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/u1-native --parallel 4
      - name: Native component tests
        run: ctest --test-dir build/u1-native --output-on-failure
      - name: Profile, G-code and maintenance tooling tests
        run: python -m unittest discover -s tools/u1/tests -v
      - name: Validate shipped U1 profile bundles
        if: runner.os == 'Linux'
        run: python scripts/orca_profile_tool.py check --vendor Snapmaker --vendor OrcaFilamentLibrary
      - name: Preserve component test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u1-component-results-${{ matrix.os }}
          path: build/u1-native/Testing/Temporary/LastTest.log
          if-no-files-found: error
